name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform folder (if missing)
        run: |
          if [ ! -d ios ]; then
            flutter create --org com.mato --project-name gyma --platforms=ios .
            sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/g' ios/Runner.xcodeproj/project.pbxproj
          fi
          grep -m1 IPHONEOS_DEPLOYMENT_TARGET ios/Runner.xcodeproj/project.pbxproj

      - name: Configure private iOS Keychain storage
        run: python3 tool/configure_ios.py

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr build/gyma-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gyma-ios-${{ github.run_number }}
          path: build/gyma-unsigned.ipa
          retention-days: 14
