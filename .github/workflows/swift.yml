name: Swift iPhone + Watch build

on:
  push:
    branches: [swift, main]
    paths:
      - 'apple/**'
      - 'tools/apple/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'tools/apple/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:
    inputs:
      watch_smoke:
        description: 'Build the Watch simulator app and run launch checks'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Check architecture boundaries
        run: python3 tools/apple/check_architecture.py

      - name: Test Apple development tools
        run: python3 -m unittest discover -s tools/apple -p 'test_*.py'

      - name: Test shared models, persistence and Watch commands
        run: |
          set -o pipefail
          mkdir -p build/apple
          swift test --package-path apple/Packages/GymaCore --scratch-path build/apple/GymaCore 2>&1 | tee build/apple/core-tests.log

      - name: Generate native Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec apple/project.yml --project apple

      - name: Build Watch app for simulator launch checks
        if: github.event_name == 'workflow_dispatch' && inputs.watch_smoke
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/Gyma.xcodeproj \
            -scheme GymaWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/apple/WatchSimulator \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/apple/watch-simulator-build.log

      - name: Check Watch startup and visible workout content
        if: github.event_name == 'workflow_dispatch' && inputs.watch_smoke
        timeout-minutes: 10
        run: python3 tools/apple/watch_launch_smoke.py build/apple/WatchSimulator/Build/Products/Release-watchsimulator/GymaWatch.app

      - name: Build iPhone and embedded Watch app
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/Gyma.xcodeproj \
            -scheme Gyma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/apple/DerivedData \
            -archivePath build/apple/Gyma.xcarchive \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee build/apple/xcodebuild.log

      - name: Package and verify unsigned IPA
        run: |
          mkdir -p build/apple/Payload
          ditto build/apple/Gyma.xcarchive/Products/Applications/Gyma.app build/apple/Payload/Gyma.app
          ditto -c -k --keepParent build/apple/Payload build/apple/gyma-swift-unsigned.ipa
          python3 tools/apple/verify_ipa.py build/apple/gyma-swift-unsigned.ipa --expected-build-version "${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v6
        with:
          name: gyma-swift-ios-watch-${{ github.run_number }}
          path: build/apple/gyma-swift-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gyma-swift-logs-${{ github.run_number }}
          path: |
            build/apple/*.log
            build/apple/watch-smoke/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload device crash symbols
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gyma-swift-symbols-${{ github.run_number }}
          path: build/apple/Gyma.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14
