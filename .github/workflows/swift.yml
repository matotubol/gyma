name: Swift iPhone build

on:
  push:
    branches: [main, gym-web-ios]
    paths:
      - 'apple/**'
      - 'tools/apple/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'apple/**'
      - 'tools/apple/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test IPA packaging checks
        run: python3 -m unittest discover -s tools/apple -p 'test_*.py'

      - name: Test API client, records and calendar logic
        run: |
          set -o pipefail
          mkdir -p build/apple
          swift test --package-path apple/Packages/GymaCore --scratch-path build/apple/GymaCore 2>&1 | tee build/apple/core-tests.log

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apple/project.yml --project apple

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/Gyma.xcodeproj \
            -scheme Gyma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/apple/DerivedData \
            -archivePath build/apple/Gyma.xcarchive \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee build/apple/xcodebuild.log

      - name: Package and verify unsigned IPA
        run: |
          mkdir -p build/apple/Payload
          ditto build/apple/Gyma.xcarchive/Products/Applications/Gyma.app build/apple/Payload/Gyma.app
          ditto -c -k --keepParent build/apple/Payload build/apple/gyma-unsigned.ipa
          python3 tools/apple/verify_ipa.py build/apple/gyma-unsigned.ipa --expected-build-version "${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v6
        with:
          name: gyma-ios-${{ github.run_number }}
          path: build/apple/gyma-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gyma-logs-${{ github.run_number }}
          path: build/apple/*.log
          if-no-files-found: ignore
          retention-days: 7
