name: Gyma
options:
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GymaCore:
    path: Packages/GymaCore
targets:
  Gyma:
    type: application
    platform: iOS
    sources:
      - iOS
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mato.gyma
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Gyma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          # Lets the app reach `wrangler dev` on your PC over the local network. The Worker itself is HTTPS.
          NSAllowsLocalNetworking: true
    dependencies:
      - package: GymaCore
schemes:
  Gyma:
    build:
      targets:
        Gyma: all
    run:
      config: Debug
    archive:
      config: Release
