workflows:
  ios:
    name: iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Generate iOS platform folder (if missing)
        script: |
          if [ ! -d ios ]; then
            flutter create --org com.mato --project-name gyma --platforms=ios .
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign --build-number=$PROJECT_BUILD_NUMBER
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr build/gyma-unsigned.ipa Payload
    artifacts:
      - build/*.ipa
